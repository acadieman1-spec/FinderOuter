[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
chromafield_mint = "35tHJjPucUNrFKyMBm8tgxYzZ8tmhHAMYp6G9mVr5AUj"

[programs.devnet]
chromafield_mint = "35tHJjPucUNrFKyMBm8tgxYzZ8tmhHAMYp6G9mVr5AUj"

# Add a [programs.mainnet] entry with a fresh, separately-generated keypair
# before a production deploy. Reusing the devnet keypair on mainnet is fine
# technically but makes an accidental deploy far too easy.

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false
