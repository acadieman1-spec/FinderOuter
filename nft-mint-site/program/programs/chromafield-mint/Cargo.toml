[package]
name = "chromafield-mint"
version = "1.0.0"
description = "CHROMAFIELD generative NFT mint program (SPL token + Metaplex metadata)"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "chromafield_mint"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "0.30.1", features = ["token"] }
# Metaplex Token Metadata v3 (CreateV1) — mints an NFT with a zero-supply
# master edition in a single CPI.
mpl-token-metadata = "4.1.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
